name: Deploy Pages
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        # use the latest configure-pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        # use upload-pages-artifact v2 which avoids the deprecated upload-artifact v3
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
