<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Todo — 本地存储 演示</title>
  <style>
:root{
  --bg:#f6f8fb;
  --card:#ffffff;
  --muted:#6b7280;
  --accent:#2563eb;
  --success:#059669;
  --danger:#ef4444;
  --shadow: 0 6px 18px rgba(15,23,42,0.06);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:linear-gradient(180deg,var(--bg),#fff);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  color:#0f172a;
}
.app{
  width:100%;
  max-width:720px;
  background:var(--card);
  border-radius:12px;
  padding:20px;
  box-shadow:var(--shadow);
}
h1{margin:0 0 12px 0;font-size:1.5rem}
#todo-form{display:flex; gap:8px; margin-bottom:12px}
#todo-input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid #e6e9ee;font-size:1rem}
#add-btn{padding:10px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer}
#add-btn:hover{opacity:0.95}
.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.filters{display:flex; gap:6px}
.filter{background:transparent;border:1px solid transparent;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
.filter.active{background:#eef2ff;color:var(--accent);border-color:#e0e7ff}
.clear{background:transparent;border:none;color:var(--danger);cursor:pointer}
.todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.todo-item{display:flex;align-items:center;background:#fbfdff;border:1px solid #eef2f6;padding:8px 10px;border-radius:8px;gap:10px}
.todo-item.completed .text{text-decoration:line-through;color:var(--muted);opacity:0.8}
.checkbox{width:18px;height:18px;border-radius:4px;border:1px solid #cbd5e1;display:grid;place-items:center;cursor:pointer}
.checkbox.checked{background:var(--success); color:#fff; border-color:var(--success)}
.text{flex:1;word-break:break-word}
.actions{display:flex;gap:8px}
.action-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem}
.action-btn:hover{color:#111827}
.edit-input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid #e6e9ee}
.footer{margin-top:12px;color:var(--muted);font-size:0.9rem}
@media (max-width:480px){.app{padding:12px}#add-btn{padding:8px 10px}}
  </style>
</head>
<body>
  <main class="app">
    <h1>待办事项（Todo）</h1>

    <form id="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="添加新任务，按回车或点 Add" aria-label="New task" required />
      <button id="add-btn" type="submit">Add</button>
    </form>

    <div class="controls">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed" class="clear">Clear completed</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="items-left">0 items left</span>
    </footer>
  </main>

  <script>
// 单文件版：Todo 应用，使用浏览器 localStorage 持久化
const STORAGE_KEY = 'todo_app_v1';
let todos = [];
let filter = 'all';
const $ = sel => document.querySelector(sel);
const todoListEl = $('#todo-list');
const form = $('#todo-form');
const input = $('#todo-input');
const itemsLeftEl = $('#items-left');
const filters = document.querySelectorAll('.filter');
const clearBtn = $('#clear-completed');

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }
function load() { try { const raw = localStorage.getItem(STORAGE_KEY); todos = raw ? JSON.parse(raw) : []; } catch { todos = []; } }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function addTodo(text) { const todo = { id: uid(), text: text.trim(), completed: false, createdAt: Date.now() }; todos.unshift(todo); save(); render(); }
function toggleTodo(id) { const t = todos.find(x => x.id === id); if (t) t.completed = !t.completed; save(); render(); }
function deleteTodo(id) { todos = todos.filter(t => t.id !== id); save(); render(); }
function updateTodoText(id, newText) { const t = todos.find(x => x.id === id); if (t) t.text = newText.trim(); save(); render(); }
function clearCompleted() { todos = todos.filter(t => !t.completed); save(); render(); }
function setFilter(f) { filter = f; filters.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === f)); render(); }
function filteredTodos() { if (filter === 'active') return todos.filter(t => !t.completed); if (filter === 'completed') return todos.filter(t => t.completed); return todos; }

function render() {
  todoListEl.innerHTML = '';
  const list = filteredTodos();
  for (const t of list) {
    const li = document.createElement('li');
    li.className = 'todo-item' + (t.completed ? ' completed' : '');
    const cb = document.createElement('div');
    cb.className = 'checkbox' + (t.completed ? ' checked' : '');
    cb.setAttribute('role', 'button');
    cb.setAttribute('aria-label', 'Toggle');
    cb.addEventListener('click', () => toggleTodo(t.id));
    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = t.text;
    const actions = document.createElement('div');
    actions.className = 'actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'action-btn';
    editBtn.textContent = 'Edit';
    editBtn.addEventListener('click', () => startEdit(t.id, text));
    const delBtn = document.createElement('button');
    delBtn.className = 'action-btn';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', () => deleteTodo(t.id));
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    li.appendChild(cb);
    li.appendChild(text);
    li.appendChild(actions);
    todoListEl.appendChild(li);
  }
  const left = todos.filter(t => !t.completed).length;
  itemsLeftEl.textContent = `${left} item${left === 1 ? '' : 's'} left`;
}

function startEdit(id, textEl) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  const inputEl = document.createElement('input');
  inputEl.className = 'edit-input';
  inputEl.value = t.text;
  textEl.replaceWith(inputEl);
  inputEl.focus();
  inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
  function finish() {
    const val = inputEl.value.trim();
    if (val.length === 0) deleteTodo(id);
    else updateTodoText(id, val);
  }
  inputEl.addEventListener('blur', () => finish());
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') finish();
    else if (e.key === 'Escape') render();
  });
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const val = input.value.trim();
  if (val) { addTodo(val); input.value = ''; }
});
filters.forEach(btn => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));
clearBtn.addEventListener('click', () => clearCompleted());
load(); render();
  </script>
</body>
</html>
