<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>多时区数字时钟</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#fff; --muted:#6b7280; --accent:#2563eb;
  }
  body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;margin:0;background:linear-gradient(180deg,var(--bg),#fff);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px;color:#0f172a}
  .wrap{width:100%;max-width:980px;background:var(--card);border-radius:12px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,0.06)}
  h1{margin:0 0 12px;font-size:1.4rem}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  select,input[type="text"]{padding:8px;border-radius:8px;border:1px solid #e6e9ee}
  button{padding:8px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{background:#fbfdff;border:1px solid #eef2f6;padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:8px;min-height:92px}
  .tz-name{font-weight:600}
  .time{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Roboto Mono,monospace;font-size:1.6rem}
  .meta{color:var(--muted);font-size:0.9rem;display:flex;justify-content:space-between;align-items:center}
  .small{font-size:0.85rem;color:var(--muted)}
  .remove{background:transparent;color:var(--muted);border:1px solid transparent;cursor:pointer;padding:6px;border-radius:6px}
  .footer{margin-top:12px;color:var(--muted);font-size:0.9rem}
  .search{min-width:220px}
  @media (max-width:480px){.wrap{padding:12px}}
</style>
</head>
<body>
  <main class="wrap">
    <h1>世界时钟</h1>

    <div class="controls">
      <label for="tz-select" class="small">选择时区：</label>
      <select id="tz-select" style="min-width:260px"></select>
      <button id="add-btn">添加</button>

      <label class="small" style="margin-left:8px">显示制：</label>
      <select id="format-toggle" title="时间格式">
        <option value="24">24 小时</option>
        <option value="12">12 小时</option>
      </select>

      <input id="search" class="search" type="text" placeholder="搜索时区（例如 Tokyo / Asia）" />
      <button id="reset-btn" style="background:#e6e6e6;color:#111">重置默认</button>
    </div>

    <div id="clocks" class="grid"></div>

    <div class="footer">提示：点击 Remove 按钮移除时区；设置会自动保存在本地。</div>
  </main>

<script>
/* 多时区数字时钟 */
const STORAGE_KEY = 'multi_tz_clocks_v1';
const tzSelect = document.getElementById('tz-select');
const clocksEl = document.getElementById('clocks');
const addBtn = document.getElementById('add-btn');
const formatToggle = document.getElementById('format-toggle');
const searchInput = document.getElementById('search');
const resetBtn = document.getElementById('reset-btn');

let use24 = true;
let clocks = []; // array of tz ids

function getZoneList(){
  if (typeof Intl === 'object' && typeof Intl.supportedValuesOf === 'function'){
    try { return Intl.supportedValuesOf('timeZone'); }
    catch(e){}
  }
  // fallback common list
  return ['UTC','Local','Europe/London','Europe/Paris','Europe/Berlin','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','Asia/Tokyo','Asia/Shanghai','Asia/Hong_Kong','Asia/Kolkata','Australia/Sydney','Pacific/Auckland'];
}

const ALL_ZONES = getZoneList();

function populateSelect(filter=''){
  tzSelect.innerHTML = '';
  // include 'Local' top
  const items = ['Local', ...ALL_ZONES.filter(z => z !== 'Local')];
  const q = filter.trim().toLowerCase();
  items.forEach(tz=>{
    if (q && !tz.toLowerCase().includes(q)) return;
    const opt = document.createElement('option');
    opt.value = tz;
    opt.textContent = tz;
    tzSelect.appendChild(opt);
  });
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({clocks, use24}));
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const obj = JSON.parse(raw);
      clocks = Array.isArray(obj.clocks) ? obj.clocks : [];
      use24 = obj.use24 !== undefined ? obj.use24 : true;
      formatToggle.value = use24 ? '24' : '12';
    }
  }catch(e){ clocks = []; use24 = true; }
}

function addClock(tz){
  if (!tz) return;
  if (clocks.includes(tz)) return;
  clocks.push(tz);
  save();
  renderClocks();
}

function removeClock(tz){
  clocks = clocks.filter(t => t !== tz);
  save();
  renderClocks();
}

function formatForZone(date, tz){
  if (tz === 'Local'){
    const timeStr = new Intl.DateTimeFormat(undefined, {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: !use24}).format(date);
    const dateStr = new Intl.DateTimeFormat(undefined,{weekday:'short',year:'numeric',month:'short',day:'2-digit'}).format(date);
    return {timeStr, dateStr, tzName: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local'};
  }
  const timeFmt = new Intl.DateTimeFormat(undefined, {timeZone:tz, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: !use24, timeZoneName:'short'});
  const dateFmt = new Intl.DateTimeFormat(undefined, {timeZone:tz, weekday:'short', year:'numeric', month:'short', day:'2-digit'});
  const parts = timeFmt.formatToParts(new Date());
  const zoneNamePart = parts.find(p=>p.type==='timeZoneName');
  const tzName = zoneNamePart ? zoneNamePart.value : tz;
  const timeStr = parts.filter(p=>p.type!=='timeZoneName').map(p=>p.value).join('');
  return {timeStr, dateStr: dateFmt.format(date), tzName};
}

function renderClocks(){
  clocksEl.innerHTML = '';
  if (clocks.length === 0){
    // default set
    ['Local','UTC','Asia/Tokyo','America/New_York','Europe/London'].forEach(addClock);
    return;
  }
  const now = new Date();
  clocks.forEach((tz, idx)=>{
    const info = formatForZone(now, tz);
    const card = document.createElement('div'); card.className='card';
    const name = document.createElement('div'); name.className='tz-name'; name.textContent=tz;
    const time = document.createElement('div'); time.className='time'; time.textContent=info.timeStr;
    const meta = document.createElement('div'); meta.className='meta';
    const dateEl = document.createElement('div'); dateEl.className='small'; dateEl.textContent=info.dateStr;
    const right = document.createElement('div'); right.style.display='flex'; right.style.alignItems='center'; right.style.gap='8px';
    const tzShort = document.createElement('div'); tzShort.className='small'; tzShort.textContent=info.tzName;
    const remove = document.createElement('button'); remove.className='remove'; remove.textContent='Remove';
    remove.addEventListener('click', ()=> removeClock(tz));
    right.appendChild(tzShort); right.appendChild(remove);
    meta.appendChild(dateEl); meta.appendChild(right);
    card.appendChild(name); card.appendChild(time); card.appendChild(meta);
    clocksEl.appendChild(card);
  });
}

function tick(){
  const now = new Date();
  const cards = clocksEl.querySelectorAll('.card');
  cards.forEach((card, idx)=>{
    const tz = clocks[idx];
    const info = formatForZone(now, tz);
    const timeEl = card.querySelector('.time');
    const smalls = card.querySelectorAll('.small');
    if (timeEl) timeEl.textContent = info.timeStr;
    if (smalls.length>0) smalls[0].textContent = info.dateStr;
    if (smalls.length>1) smalls[1].textContent = info.tzName;
  });
}

/* events */
addBtn.addEventListener('click', ()=> {
  const val = tzSelect.value;
  addClock(val);
});
formatToggle.addEventListener('change', (e)=> {
  use24 = (e.target.value === '24');
  save();
  renderClocks();
});
searchInput.addEventListener('input', (e)=> populateSelect(e.target.value));
resetBtn.addEventListener('click', ()=>{
  localStorage.removeItem(STORAGE_KEY);
  clocks = []; use24 = true;
  formatToggle.value='24';
  populateSelect();
  renderClocks();
});

/* init */
load();
populateSelect();
renderClocks();
setInterval(tick, 1000);
</script>
</body>
</html>
